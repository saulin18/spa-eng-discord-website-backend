
services:
    postgres: 
      container_name: spa-eng-discord-postgres
      image: postgres:17
      env_file: .env
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
    app:
      container_name: app
      build:
        context: .
        dockerfile: Dockerfile
      env_file: .env
      ports:
        - "8080:8080"
      depends_on:
        - postgres

volumes:
  postgres_data: 